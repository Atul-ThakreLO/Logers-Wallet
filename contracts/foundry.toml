[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.25"
ffi = true
fs_permissions = [
  { access = "read", path = "./broadcast" },
  { access = "write", path = "./broadcast" }
]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "@openzeppelin-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
  "@account-abstraction/=lib/account-abstraction/",
  "@solady/=lib/solady/src/",
  "@p256/=lib/p256-verifier/src/",
  "@chainlink/=lib/chainlink/contracts/src/v0.8/",
]

[profile.default.fuzz]
runs = 1000
seed = "0x00000000000000000000000000000000000000000000000000004c30674552530"

[profile.default.invariant]
runs = 256
depth = 32

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 1000 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
